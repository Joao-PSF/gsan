# Stub do serviço de SSO externo do GSAN (seguranca.parametro URL_SEGURANCA).
# gcom.gui.util.FiltroSSO -> gcom.util.GerenciadorSSO chama, em TODA requisição *.do,
# GET <URL_SEGURANCA>/authorization?token=<cookie "gsan">. Com HTTP 200 o corpo da
# resposta vira o id do usuário logado; com outro status, segue o login do próprio GSAN;
# sem resposta (serviço inalcançável), a exceção derruba a requisição. Este stub responde
# sempre 401 — "sem sessão SSO": o laboratório usa só o login do GSAN.
server {
    listen 8081;

    location = /authorization {
        return 401;
    }

    location / {
        return 404;
    }
}
