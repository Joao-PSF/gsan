# Única porta de entrada do ambiente. O GSAN e o banco ficam numa rede interna
# sem saída para a internet; o proxy é o único serviço nas duas redes.
# Só /gsan é exposto: o JBoss 4 também serve jmx-console, web-console e o
# mondrian.war da receita, sem autenticação — nada disso é necessário ao oráculo.
server {
    listen 80;
    client_max_body_size 64m;
    # Redirecionamentos relativos: atrás do acesso remoto (Cloudflare, HTTPS na borda) um
    # Location absoluto em http:// trocaria o esquema; relativo vale nos dois casos.
    absolute_redirect off;

    location = / {
        return 302 /gsan/;
    }

    location /gsan {
        proxy_pass http://gsan:8080;
        # Host original (com a porta publicada): os redirecionamentos do
        # Tomcat 5 montam a URL absoluta a partir dele.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        # O Tomcat 5 não conhece X-Forwarded-Proto: o Location que ele monta é sempre
        # http://<host>/...; vira caminho relativo à origem (o código do GSAN não muda).
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location / {
        return 404;
    }
}
