# GSAN de referência (Fase 1). Use sempre por scripts/referencia.sh, que passa
# versoes.env e .env a este arquivo.
name: gsan-referencia

x-segredos-banco: &segredos-banco
  GSAN_DB_HOST: db
  GSAN_DB_PORTA: "5432"
  GSAN_DB_USUARIO: postgres
  GSAN_DB_SENHA: ${GSAN_DB_SENHA:?defina GSAN_DB_SENHA no .env}

x-imagem-jboss: &imagem-jboss
  image: gsan-referencia/jboss:4.0.1sp1-jdk6
  build:
    context: ./imagens/jboss
    additional_contexts:
      driver: ../lib/driver-postgres
    args:
      IMG_ALPINE: ${IMG_ALPINE}
      IMG_DEBIAN: ${IMG_DEBIAN}
      JDK6_URL: ${JDK6_URL}
      JDK6_SHA256: ${JDK6_SHA256}
      JBOSS_URL: ${JBOSS_URL}
      JBOSS_SHA1: ${JBOSS_SHA1}
      ANT_URL: ${ANT_URL}
      ANT_SHA512: ${ANT_SHA512}
      PRODIGA_TI_REPO: ${PRODIGA_TI_REPO}
      PRODIGA_TI_COMMIT: ${PRODIGA_TI_COMMIT}
      JBOSS_LIBS_REPO: ${JBOSS_LIBS_REPO}
      JBOSS_LIBS_COMMIT: ${JBOSS_LIBS_COMMIT}

x-imagem-ferramentas: &imagem-ferramentas
  image: gsan-referencia/ferramentas
  build:
    context: ./imagens/ferramentas
    args:
      IMG_ALPINE: ${IMG_ALPINE}

services:
  db:
    image: gsan-referencia/postgres:9.5-latin1
    build:
      context: ./imagens/postgres
      args:
        IMG_POSTGRES: ${IMG_POSTGRES}
    environment:
      POSTGRES_PASSWORD: ${GSAN_DB_SENHA:?defina GSAN_DB_SENHA no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgindices:/opt/pgsql/indices
    networks: [interna]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

  gsan:
    <<: *imagem-jboss
    environment:
      <<: *segredos-banco
      GSAN_JVM_XMS: ${GSAN_JVM_XMS:-512m}
      GSAN_JVM_XMX: ${GSAN_JVM_XMX:-1024m}
      GSAN_JVM_MAXPERM: ${GSAN_JVM_MAXPERM:-512m}
    volumes:
      - ear:/opt/jboss/server/default/deploy/gcom.ear
      - jboss-log:/opt/jboss/server/default/log
    networks: [interna]
    depends_on:
      db:
        condition: service_healthy
      sso:
        condition: service_started

  # Stub do SSO externo que o GSAN consulta em toda requisição (ver imagens/sso/nginx.conf).
  sso:
    image: ${IMG_NGINX}
    volumes:
      - ./imagens/sso/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [interna]

  proxy:
    image: ${IMG_NGINX}
    volumes:
      - ./imagens/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GSAN_PORTA_HTTP:-8080}:80"
    networks: [interna, externa]
    depends_on: [gsan]

  # Build do EAR: sem rede nenhuma.
  construtor:
    <<: *imagem-jboss
    profiles: [ferramentas]
    entrypoint: ["/opt/gsan-referencia/build-legado.sh"]
    environment:
      GSAN_TIPO: ${GSAN_TIPO:-Online}
      GSAN_VERSAO: ${GSAN_VERSAO:-referencia}
      GSAN_COMMIT_LEGADO: ${GSAN_COMMIT_LEGADO}
    volumes:
      - ear:/opt/jboss/server/default/deploy/gcom.ear
      - ./.saida:/saida
    network_mode: none

  # Obtenção das migrações: único passo das ferramentas com acesso externo.
  obter:
    <<: *imagem-ferramentas
    profiles: [ferramentas]
    environment:
      GSAN_MIGRACOES_REPO: ${GSAN_MIGRACOES_REPO}
      GSAN_MIGRACOES_COMMIT: ${GSAN_MIGRACOES_COMMIT}
    volumes:
      - ./scripts:/referencia/scripts:ro
      - migracoes:/migracoes
    networks: [externa]

  # Banco e verificação: só na rede interna.
  ferramentas:
    <<: *imagem-ferramentas
    profiles: [ferramentas]
    environment:
      <<: *segredos-banco
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${GSAN_DB_SENHA}
      # Mensagens do servidor em inglês: o cluster é pt_BR.ISO-8859-1 e os logs
      # das ferramentas ficam legíveis em qualquer terminal.
      PGOPTIONS: "-c lc_messages=C"
      GSAN_ADMIN_SENHA: ${GSAN_ADMIN_SENHA:?defina GSAN_ADMIN_SENHA no .env}
      GSAN_MIGRACOES_CODIFICACAO: ${GSAN_MIGRACOES_CODIFICACAO:-detectar}
      GSAN_MIGRACOES_COMMIT: ${GSAN_MIGRACOES_COMMIT}
      GSAN_VARIANTE: ${GSAN_VARIANTE:-}
      GSAN_TIPO: ${GSAN_TIPO:-Online}
    volumes:
      - ./scripts:/referencia/scripts:ro
      - ./banco:/referencia/banco:ro
      # Fontes do legado, só leitura: mapeamentos Hibernate para o P6 e a verificação.
      - ../src:/legado/src:ro
      - migracoes:/migracoes:ro
      - jboss-log:/jboss-log:ro
      - ./.saida:/saida
    networks: [interna]

networks:
  interna:
    internal: true
  externa: {}

volumes:
  pgdata:
  pgindices:
  ear:
  jboss-log:
  migracoes:
